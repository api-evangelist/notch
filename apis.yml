aid: notch
name: Notch
description: >-
  Notch (formerly OrderEZE/ChefHero) brings the restaurant supply chain online,
  digitizing the paper-driven process of wholesale food ordering and order
  taking between restaurants and their distributors. Founded in 2015 and
  headquartered in Toronto, the platform spans four product surfaces — Order
  Manager and Invoice Manager for buyers, AP Manager for restaurant accounts
  payable, and AR Manager for distributor accounts receivable — handling order
  placement, invoice management, reconciliation, payment collection, and payment
  processing for food and beverage suppliers and buyers. Notch keeps ordering
  and finance workflows in sync through one-way and two-way connectors to
  accounting and ERP systems including QuickBooks Online, QuickBooks Desktop,
  NetSuite, Xero, and Microsoft Dynamics 365, plus CSV import/export. Notch does
  not publish a public developer API or developer portal; its accounting/ERP
  connectivity is delivered through its own connectors and the third-party
  Rutter unified accounting API, so Notch operates as an API consumer rather
  than an API provider. (This profile covers Notch the restaurant-to-supplier
  ordering and AR/AP automation company at notch.financial, and is unrelated to
  "Notch Pay," the African payments company at developer.notchpay.co.)
