features:
  - name: Order Manager
    description: Lets restaurants and buyers place and track wholesale food orders with their distributors, price compare, and shop across a large catalog of SKUs from a mobile app or web browser.
  - name: Invoice Manager
    description: Centralizes incoming supplier invoices, digitizing the paper-driven invoicing process so buyers can review, manage, and approve invoices in one place.
  - name: AP Manager
    description: Accounts payable automation for restaurants — schedules and processes payments to suppliers and keeps payment data in sync with the accounting system.
  - name: AR Manager
    description: Accounts receivable automation for distributors — generates and sends invoices on a recurring schedule, collects payments, and reconciles them against the accounting system.
  - name: Payment Processing and Collection
    description: Handles payment collection and processing between buyers and suppliers, automatically matching payments to the correct invoices.
  - name: Accounting and ERP Sync
    description: One-way or two-way syncing that pushes bills paid, outstanding invoices, and collections data into the customer's accounting or ERP system in real time.
useCases:
  - name: Digitize Wholesale Food Ordering
    description: Move restaurant-to-distributor ordering off paper, phone, and fax onto a single mobile and web platform with order tracking and real-time catalog data.
  - name: Automate Distributor Accounts Receivable
    description: Food and beverage distributors automatically generate invoices, collect payments, and reconcile them against their ERP, reducing days sales outstanding.
  - name: Automate Restaurant Accounts Payable
    description: Restaurants consolidate supplier invoices and automate scheduled payments while keeping their accounting system continuously reconciled.
  - name: Keep Finance Systems in Sync
    description: Eliminate manual re-keying between ordering/invoicing and accounting by syncing orders, invoices, and payments to QuickBooks, NetSuite, Xero, or Dynamics 365.
