aid: notch
name: Notch
description: >-
  Notch, formerly OrderEZE/Notch, brings the restaurant supply chain online,
  digitizing the paper-driven process of wholesale food ordering and order
  taking between restaurants and their distributors. The platform has expanded
  into accounts receivable and accounts payable automation, handling payment
  collection, invoice management, reconciliation, and payment processing for
  food and beverage suppliers and buyers. Notch offers key integrations with
  accounting and ERP systems to keep ordering and finance workflows in sync.
  Notch does not appear to publish a public developer API; integrations are
  delivered through its accounting and ERP connectors rather than a documented
  developer portal.
